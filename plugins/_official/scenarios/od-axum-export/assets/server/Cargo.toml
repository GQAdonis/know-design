[package]
name = "od-prototype-server"
version = "0.1.0"
edition = "2021"
publish = false
description = "Axum fragment server exported from a KnowDesign htmx + Alpine prototype"

[dependencies]
axum = "0.8.9"
minijinja = { version = "3.1.0", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_urlencoded = "0.7"
tokio = { version = "1.54", features = ["macros", "rt-multi-thread", "net", "sync"] }
tower-http = { version = "0.7.1", features = ["cors", "fs"] }
